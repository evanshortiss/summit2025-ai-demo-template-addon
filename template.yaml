apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: langchain-agent-python
  title: LangChain AI Agent for Kafka Message Analysis
  description: Create an AI-powered agent that monitors Kafka topics, analyzes failed message routing, and sends notifications to Backstage
  tags:
    - ai
    - langchain
    - kafka
    - python
    - monitoring
    - notifications
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Service Information
      required:
        - name
        - description
        - owner
        - system
      properties:
        name:
          title: Name
          type: string
          description: Unique name for the AI agent service
          pattern: '^[a-z0-9-]+$'
          ui:help: 'Must be lowercase letters, numbers, and hyphens only'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: A description of what this AI agent will monitor and analyze
        owner:
          title: Owner
          type: string
          description: Owner team for this AI agent
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: 
                - Group
                - User
        system:
          title: System
          type: string
          description: The system this AI agent belongs to
          ui:field: EntityPicker
          ui:options:
            allowMultiple: false
            allowArbitraryValues: false
            catalogFilter:
              kind: System

    - title: Kafka Configuration
      required:
        - consumerGroup
        - monitoredTopic
      properties:
        consumerGroup:
          title: Consumer Group ID
          type: string
          description: Kafka consumer group ID for this agent
          pattern: '^[a-z0-9-]+$'
          ui:help: 'Must be lowercase letters, numbers, and hyphens only'
          ui:autofocus: true
        monitoredTopic:
          title: Monitored Topic
          type: string
          description: Select a Kafka topic to monitor for failed routing messages
          ui:field: EntityPicker
          ui:options:
            allowMultiple: false
            allowArbitraryValues: true
            catalogFilter:
              - kind: Resource
                spec.type: topic

    - title: AI Configuration
      required:
        - aiModel
      properties:
        aiModel:
          title: AI Model
          type: string
          description: AI model resource to use for analysis
          ui:field: EntityPicker
          ui:options:
            allowMultiple: false
            allowArbitraryValues: true
            catalogFilter:
              kind: Component
              spec.type: model-server



  steps:
    - id: parseTopicEntity
      name: Parse Topic Entity Reference
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.monitoredTopic }}

    - id: parseAiModelEntity
      name: Parse AI Model Entity Reference
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.aiModel }}

    - id: fetch
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          host: github.com
          owner: rhdh-demo-gh
          catalog_owner: ${{ parameters.owner }}
          destination: ${{ parameters.name }}
          cluster: .apps.cluster-nz5zn.nz5zn.sandbox5486.opentlc.com
          image_registry: GitHub Container Registry
          image_organization: rhdh-demo-gh
          image_host: ghcr.io
          image_name: ${{ parameters.name }}
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          system: ${{ parameters.system }}
          consumerGroup: ${{ parameters.consumerGroup }}
          monitoredTopic: ${{ parameters.monitoredTopic }}
          # Extract the actual topic name from the kafka.io/topic-name annotation
          kafkaTopicName: ${{ steps.parseTopicEntity.output.entity.metadata.annotations['kafka.io/topic-name'] }}
          aiModel: ${{ steps.parseAiModelEntity.output.entity.metadata.name }}
          inferenceServerUrl: ${{ steps.parseAiModelEntity.output.entity.metadata.links[0].url }}

    - id: publish
      name: Publish to Repository
      action: publish:github
      input:
        repoVisibility: public
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=rhdh-demo-gh&repo=${{ parameters.name }}
        defaultBranch: main
        collaborators:
          - team: core-team
            access: maintain

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    - id: create-argocd-resources
      name: Create ArgoCD Resources
      action: argocd:create-resources
      input:
        appName: ${{ parameters.name }}-bootstrap
        argoInstance: main
        namespace: openshift-gitops
        labelValue: ${{ parameters.name }}
        # projectName: default
        repoUrl: https://github.com/rhdh-demo-gh/${{ parameters.name }}.git
        path: 'manifests/argocd/'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }} 
